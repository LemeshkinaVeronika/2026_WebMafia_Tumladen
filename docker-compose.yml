version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: webmafia
      POSTGRES_USER: webmafia
      POSTGRES_PASSWORD: webmafia
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webmafia -d webmafia"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tumladan_net

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "-path=/migrations"
      - "-database=postgres://webmafia:webmafia@postgres:5432/webmafia?sslmode=disable"
      - "up"
    volumes:
      - ./migrations:/migrations:ro
    networks:
      - tumladan_net

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - tumladan_net

volumes:
  postgres_data:

networks:
  tumladan_net:
    external: true

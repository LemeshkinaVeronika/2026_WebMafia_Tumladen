apiVersion: v1
kind: Secret
metadata:
  name: tumladan-secrets
  namespace: tumladan
type: Opaque
stringData:
  JWT_SECRET: REPLACE_WITH_RANDOM_VALUE
  CSRF_SECRET: REPLACE_WITH_ANOTHER_RANDOM_VALUE
  DB_USER: webmafia
  DB_PASSWORD: REPLACE_WITH_DATABASE_PASSWORD
  DATABASE_URL: postgres://webmafia:REPLACE_WITH_DATABASE_PASSWORD@postgres:5432/webmafia?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  MINIO_ACCESS_KEY: REPLACE_WITH_MINIO_ACCESS_KEY
  MINIO_SECRET_KEY: REPLACE_WITH_MINIO_SECRET_KEY


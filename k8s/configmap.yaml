apiVersion: v1
kind: ConfigMap
metadata:
  name: tumladan-config
  namespace: tumladan
data:
  APP_ENV: prod
  HTTP_HOST: 0.0.0.0
  HTTP_PORT: "8080"
  LOG_LEVEL: info
  JWT_TTL: 24h
  CSRF_TTL: 2h
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: webmafia
  DB_SSLMODE: disable
  DB_MAX_OPEN_CONNS: "20"
  DB_MAX_IDLE_CONNS: "10"
  DB_CONN_MAX_LIFETIME: 30m
  MINIO_ENDPOINT: minio:9000
  MINIO_BUCKET: tumladan-assets
  MINIO_AVATAR_BUCKET: tumladan-avatars
  MINIO_USE_SSL: "false"
  REDIS_KEY_PREFIX: tumladan
  REDIS_TIMEOUT: 2s
  KAFKA_BROKERS: kafka:9092
  KAFKA_MATCH_EVENTS_TOPIC: tumladan.match-events.v1
  KAFKA_MATCH_EVENTS_DLQ_TOPIC: tumladan.match-events.v1.dlq
  KAFKA_CONSUMER_GROUP: tumladan-match-projections-v1
  OUTBOX_POLL_INTERVAL: 500ms
  OUTBOX_BATCH_SIZE: "100"
  OUTBOX_MAX_ATTEMPTS: "10"
  CORS_ALLOWED_ORIGINS: https://tumladen.online


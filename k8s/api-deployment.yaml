apiVersion: apps/v1
kind: Deployment
metadata:
  name: tumladan-api
  namespace: tumladan
  labels:
    app.kubernetes.io/name: tumladan-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tumladan
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tumladan-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tumladan-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: tumladan
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/lemeshkinaveronika/2026_webmafia_tumladan:latest
          imagePullPolicy: IfNotPresent
          command: ["/server"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tumladan-config
            - secretRef:
                name: tumladan-secrets
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

